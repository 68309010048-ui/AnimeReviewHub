<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Review Hub</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- ===========================
         User Bar
    ============================ -->

    <div class="top-user">

        <span id="username">
            Loading...
        </span>

       <button id="logoutBtn">
    Logout
</button>

    </div>

    <!-- ===========================
         Header
    ============================ -->

    <header>

        <div class="logo">

            <i class="fa-solid fa-film"></i>

            <h1>Anime Review Hub</h1>

        </div>

        <!-- Search -->

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="search"
                placeholder="ค้นหาอนิเมะ...">

        </div>

        <!-- Menu -->

        <div class="menu-btn">

            <a href="pages/favorite.html" class="nav-btn">
                ❤️ Favorite
            </a>

            <a href="pages/bookmark.html" class="nav-btn">
                🔖 Bookmark
            </a>

            <a
    href="pages/admin.html"
    id="adminMenu"
    class="nav-btn">

    ⚙️ Admin

    </a>
        </div>

    </header>

    <!-- ===========================
         Category
    ============================ -->

    <section class="category">

        <button class="active" onclick="filterAnime(event,'All')">
    ทั้งหมด
</button>

<button onclick="filterAnime(event,'Action')">
    Action
</button>

<button onclick="filterAnime(event,'Adventure')">
    Adventure
</button>

<button onclick="filterAnime(event,'Fantasy')">
    Fantasy
</button>

<button onclick="filterAnime(event,'Comedy')">
    Comedy
</button>

<button onclick="filterAnime(event,'Romance')">
    Romance
</button>

<button onclick="filterAnime(event,'Sport')">
    Sport
</button>
    </section>

    <!-- ===========================
         Title
    ============================ -->

    <section class="title">

        <h2>
            🔥 Anime แนะนำ
        </h2>

    </section>

    <!-- ===========================
         Anime List
    ============================ -->

    <section
        class="anime-container"
        id="animeList">

    </section>

    <!-- ===========================
         Script
    ============================ -->

    <script type="module" src="js/script.js"></script>
<script type="module" src="js/user.js"></script>

</body>

</html>
