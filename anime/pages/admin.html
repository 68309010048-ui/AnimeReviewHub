<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime Review Hub | Admin</title>

<link rel="stylesheet" href="../css/admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Top -->

    <div class="topbar">

        <h1>

            <i class="fa-solid fa-user-shield"></i>

            Admin Panel

        </h1>

        <a href="../index.html" class="homeBtn">

            🏠 กลับหน้าหลัก

        </a>

    </div>

    <!-- Dashboard -->

    <div class="dashboard">

        <div class="box">

            <h2 id="animeCount">0</h2>

            <p>Anime</p>

        </div>

        <div class="box">

            <h2 id="userCount">0</h2>

            <p>Users</p>

        </div>

        <div class="box">

            <h2 id="reviewCount">0</h2>

            <p>Reviews</p>

        </div>

    </div>

    <!-- Search -->

    <div class="search">

        <input
        type="text"
        id="searchAnime"
        placeholder="🔍 ค้นหาอนิเมะ...">

    </div>

    <!-- Form -->

    <div class="card">

        <h2>

            เพิ่ม / แก้ไข อนิเมะ

        </h2>

        <input type="text" id="title" placeholder="ชื่ออนิเมะ">

    <input type="text" id="image" placeholder="URL รูปภาพ">

    <input type="text" id="category" placeholder="หมวดหมู่">

    <input type="number" id="episodes" placeholder="จำนวนตอน">   

    <input type="text" id="status" placeholder="สถานะ เช่น Finished Airing">

    <input type="text" id="type" placeholder="ประเภท เช่น TV, Movie, OVA">

    <input type="text" id="trailer" placeholder="YouTube URL">  

    <textarea id="description" placeholder="รายละเอียด"></textarea>

        <div class="btn-group">

            <button id="addAnime">

                เพิ่มอนิเมะ

            </button>

            <button
            id="cancelEdit"
            style="display:none;">

                ยกเลิกการแก้ไข

            </button>

        </div>

    </div>

    <hr>

    <h2 class="list-title">

        รายการอนิเมะ

    </h2>

    <div id="animeList"></div>

</div>

<script type="module" src="../js/admin.js"></script>

</body>

</html>
