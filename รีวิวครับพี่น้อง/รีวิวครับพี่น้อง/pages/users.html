<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Users Management - Anime Review Hub</title>

    <link rel="stylesheet"
          href="../css/users.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>


    <!-- =========================================
         Header
    ========================================== -->

    <header class="users-header">

        <div class="header-left">

            <a href="admin.html"
               class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                กลับ Admin

            </a>

            <div class="page-title">

                <i class="fa-solid fa-users"></i>

                <div>

                    <h1>Users Management</h1>

                    <p>
                        จัดการผู้ใช้และสิทธิ์การเข้าใช้งาน
                    </p>

                </div>

            </div>

        </div>

        <div class="role-badge">

            <i class="fa-solid fa-shield-halved"></i>

            Super Admin

        </div>

    </header>


    <!-- =========================================
         Main
    ========================================== -->

    <main class="users-container">


        <!-- =====================================
             Dashboard
        ====================================== -->

        <section class="users-summary">

            <div class="summary-card">

                <div class="summary-icon user-icon">

                    <i class="fa-solid fa-user"></i>

                </div>

                <div>

                    <h2 id="totalUsers">
                        0
                    </h2>

                    <p>
                        Users
                    </p>

                </div>

            </div>


            <div class="summary-card">

                <div class="summary-icon admin-icon">

                    <i class="fa-solid fa-user-shield"></i>

                </div>

                <div>

                    <h2 id="totalAdmins">
                        0
                    </h2>

                    <p>
                        Admins
                    </p>

                </div>

            </div>


            <div class="summary-card">

                <div class="summary-icon superadmin-icon">

                    <i class="fa-solid fa-crown"></i>

                </div>

                <div>

                    <h2 id="totalSuperAdmins">
                        0
                    </h2>

                    <p>
                        Super Admins
                    </p>

                </div>

            </div>

        </section>


        <!-- =====================================
             Search
        ====================================== -->

        <section class="search-panel">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchUser"
                    placeholder="ค้นหาชื่อหรืออีเมล...">

            </div>

        </section>


        <!-- =====================================
             User List
        ====================================== -->

        <section class="users-card">

            <div class="users-card-header">

                <div>

                    <h2>
                        รายชื่อผู้ใช้
                    </h2>

                    <p>
                        ผู้ใช้ทั้งหมดในระบบ
                    </p>

                </div>

                <button
                    id="refreshUsers"
                    class="refresh-btn">

                    <i class="fa-solid fa-rotate"></i>

                    รีเฟรช

                </button>

            </div>


            <!-- Loading -->

            <div
                id="loading"
                class="loading">

                <div class="loader"></div>

                <p>
                    กำลังโหลดข้อมูล...
                </p>

            </div>


            <!-- User Table -->

            <div
                id="usersTableWrapper"
                class="table-wrapper"
                style="display:none;">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ผู้ใช้
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Role
                            </th>

                            <th>
                                การจัดการ
                            </th>

                        </tr>

                    </thead>

                    <tbody id="usersTable">

                    </tbody>

                </table>

            </div>


            <!-- Empty -->

            <div
                id="emptyUsers"
                class="empty-users"
                style="display:none;">

                <i class="fa-solid fa-user-slash"></i>

                <h3>
                    ไม่พบผู้ใช้
                </h3>

                <p>
                    ยังไม่มีข้อมูลผู้ใช้ที่ตรงกับการค้นหา
                </p>

            </div>

        </section>

    </main>


    <!-- =========================================
         Toast
    ========================================== -->

    <div id="toast"></div>


    <!-- =========================================
         Script
    ========================================== -->

    <script
        type="module"
        src="../js/user.js">
    </script>

</body>

</html>
