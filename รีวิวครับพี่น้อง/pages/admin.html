<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Anime Review Hub | Admin</title>

<link rel="stylesheet" href="../css/admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Top -->

    <div class="topbar">

        <h1>

            <i class="fa-solid fa-user-shield"></i>

            Admin Panel

        </h1>

        <a href="../index.html" class="homeBtn">

            🏠 กลับหน้าหลัก

        </a>

    </div>

    <!-- Dashboard -->

    <div class="dashboard">

        <div class="box">

            <h2 id="animeCount">0</h2>

            <p>Anime</p>

        </div>

        <div class="box">

            <h2 id="userCount">0</h2>

            <p>Users</p>

        </div>

        <div class="box">

            <h2 id="reviewCount">0</h2>

            <p>Reviews</p>

        </div>

    </div>

    <!-- Search -->

    <div class="card">

    <h2>เพิ่ม / แก้ไข อนิเมะ</h2>

    <input type="text"
           id="title"
           placeholder="ชื่ออนิเมะ">

    <input type="text"
           id="image"
           placeholder="URL รูปภาพ">

    <!-- Category -->

    <label class="form-title">

        Category

    </label>

    <div class="category-group">

        <label><input type="checkbox" value="Action"> 🟣 Action</label>

        <label><input type="checkbox" value="Adventure"> 🟢 Adventure</label>

        <label><input type="checkbox" value="Fantasy"> 🟠 Fantasy</label>

        <label><input type="checkbox" value="Comedy"> 🟡 Comedy</label>

        <label><input type="checkbox" value="Romance"> ❤️ Romance</label>

        <label><input type="checkbox" value="Sport"> ⚽ Sport</label>

        <label><input type="checkbox" value="Drama"> 🎭 Drama</label>

        <label><input type="checkbox" value="Sci-Fi"> 🚀 Sci-Fi</label>

        <label><input type="checkbox" value="Mystery"> 🕵️ Mystery</label>

        <label><input type="checkbox" value="Horror"> 👻 Horror</label>

        <label><input type="checkbox" value="School"> 🏫 School</label>

        <label><input type="checkbox" value="Slice of Life"> 🌸 Slice of Life</label>

        <label><input type="checkbox" value="Supernatural"> ✨ Supernatural</label>

        <label><input type="checkbox" value="Isekai"> 🌍 Isekai</label>

        <label><input type="checkbox" value="Music"> 🎵 Music</label>

    </div>

    <input type="number"
           id="episodes"
           placeholder="จำนวนตอน">

    <input type="text"
           id="status"
           placeholder="สถานะ">

    <input type="text"
           id="type"
           placeholder="ประเภท">

    <input type="text"
           id="trailer"
           placeholder="YouTube URL">

    <textarea
        id="description"
        placeholder="เรื่องย่อ"></textarea>

    <div class="btn-group">

        <button id="addAnime">

            เพิ่มอนิเมะ

        </button>

        <button id="cancelEdit"
                style="display:none">

            ยกเลิกการแก้ไข

        </button>

    </div>

</div>

    <hr>

    <h2 class="list-title">

        รายการอนิเมะ

    </h2>

    <div id="animeList"></div>

</div>

<script type="module" src="../js/admin.js"></script>

</body>

</html>
