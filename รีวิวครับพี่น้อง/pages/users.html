<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>User Management - Anime Review Hub</title>

    <link
        rel="stylesheet"
        href="../css/users.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- =========================
         Header
    ========================== -->

    <header class="users-header">

        <div class="header-left">

            <a
                href="../index.html"
                class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                กลับหน้าแรก

            </a>

            <div class="page-title">

                <div class="title-icon">

                    <i class="fa-solid fa-users-gear"></i>

                </div>

                <div>

                    <h1>
                        User Management
                    </h1>

                    <p>
                        จัดการ Users และ Admin
                    </p>

                </div>

            </div>

        </div>

        <div class="role-badge">

            <i class="fa-solid fa-crown"></i>

            Super Admin

        </div>

    </header>


    <!-- =========================
         Main
    ========================== -->

    <main class="users-container">


        <!-- =========================
             Summary
        ========================== -->

        <section class="summary-grid">

            <div
                class="summary-card user-card"
                data-filter="user">

                <div class="summary-icon">

                    <i class="fa-solid fa-user"></i>

                </div>

                <div>

                    <h2 id="totalUsers">
                        0
                    </h2>

                    <p>
                        Users
                    </p>

                </div>

            </div>


            <div
                class="summary-card admin-card"
                data-filter="admin">

                <div class="summary-icon">

                    <i class="fa-solid fa-user-shield"></i>

                </div>

                <div>

                    <h2 id="totalAdmins">
                        0
                    </h2>

                    <p>
                        Admins
                    </p>

                </div>

            </div>


            <div
                class="summary-card super-card"
                data-filter="superadmin">

                <div class="summary-icon">

                    <i class="fa-solid fa-crown"></i>

                </div>

                <div>

                    <h2 id="totalSuperAdmins">
                        0
                    </h2>

                    <p>
                        Super Admins
                    </p>

                </div>

            </div>

        </section>


        <!-- =========================
             Search
        ========================== -->

        <section class="search-panel">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchUser"
                    placeholder="ค้นหาชื่อหรืออีเมล...">

            </div>

        </section>


        <!-- =========================
             Filter
        ========================== -->

        <section class="filter-bar">

            <button
                class="filter-btn active"
                data-filter="all">

                ทั้งหมด

            </button>

            <button
                class="filter-btn"
                data-filter="user">

                👤 Users

            </button>

            <button
                class="filter-btn"
                data-filter="admin">

                🛡 Admins

            </button>

            <button
                class="filter-btn"
                data-filter="superadmin">

                👑 Super Admins

            </button>

        </section>


        <!-- =========================
             User Table
        ========================== -->

        <section class="users-card">

            <div class="card-header">

                <div>

                    <h2>
                        รายชื่อผู้ใช้
                    </h2>

                    <p id="resultText">
                        กำลังโหลด...
                    </p>

                </div>

                <button
                    id="refreshUsers"
                    class="refresh-btn">

                    <i class="fa-solid fa-rotate"></i>

                    รีเฟรช

                </button>

            </div>


            <!-- Loading -->

            <div
                id="loading"
                class="loading">

                <div class="loader"></div>

                <p>
                    กำลังโหลดข้อมูล...
                </p>

            </div>


            <!-- Table -->

            <div
                id="usersTableWrapper"
                class="table-wrapper"
                style="display:none;">

                <table>

                    <thead>

                        <tr>

                            <th>
                                ผู้ใช้
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Role
                            </th>

                            <th>
                                การจัดการ
                            </th>

                        </tr>

                    </thead>

                    <tbody id="usersTable">

                    </tbody>

                </table>

            </div>


            <!-- Empty -->

            <div
                id="emptyUsers"
                class="empty-users"
                style="display:none;">

                <i class="fa-solid fa-user-slash"></i>

                <h3>
                    ไม่พบข้อมูล
                </h3>

                <p>
                    ลองค้นหาหรือเลือก Role อื่น
                </p>

            </div>

        </section>

    </main>


    <!-- Toast -->

    <div id="toast"></div>


    <script
        type="module"
        src="../js/users.js">
    </script>

</body>

</html>
