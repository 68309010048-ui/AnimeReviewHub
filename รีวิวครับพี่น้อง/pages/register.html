<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - Anime Review Hub</title>

    <link
        rel="stylesheet"
        href="../css/auth.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="auth-box">

    <div
        class="card"
        style="max-width:500px;margin:50px auto;">

        <h2 style="text-align:center;">
            สมัครสมาชิก
        </h2>


        <!-- Name -->

        <input
            type="text"
            id="name"
            placeholder="ชื่อ">


        <!-- Email -->

        <input
            type="email"
            id="email"
            placeholder="Email">


        <!-- Password -->

        <input
            type="password"
            id="password"
            placeholder="Password">


        <!-- Register -->

        <button id="registerBtn">

            <i class="fa-solid fa-user-plus"></i>

            สมัครสมาชิก

        </button>


        <!-- Google Register -->

        <button
            id="googleRegisterBtn"
            class="google-btn">

            <i class="fa-brands fa-google"></i>

            สมัครสมาชิกด้วย Google

        </button>


        <!-- Login -->

        <p style="text-align:center;">

            มีบัญชีแล้ว ?

            <a
                href="login.html"
                style="color:#6d28d9;font-weight:bold;">

                เข้าสู่ระบบ

            </a>

        </p>

        <p
            id="message"
            class="message">
        </p>

    </div>

</div>


<script
    type="module"
    src="../js/auth.js">
</script>

</body>

</html>
