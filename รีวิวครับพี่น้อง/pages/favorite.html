<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Favorite - Anime Review Hub</title>

    <link rel="stylesheet" href="../css/favorite.css">
    <link rel="stylesheet" href="../css/theme.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- ==================================================
         HEADER
    ================================================== -->

    <header class="page-header">

        <div class="header-inner">

            <a
                href="../index.html"
                class="back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                <span>กลับหน้าแรก</span>

            </a>


            <div class="page-heading">

                <div class="heading-icon favorite-icon">

                    <i class="fa-solid fa-heart"></i>

                </div>

                <div>

                    <h1>
                        Favorite
                    </h1>

                    <p>
                        อนิเมะที่คุณเพิ่มไว้ในรายการโปรด
                    </p>

                </div>

            </div>

        </div>

    </header>


    <!-- ==================================================
         MAIN
    ================================================== -->

    <main class="page-container">


        <!-- ==================================================
             SEARCH + COUNT
        ================================================== -->

        <section class="toolbar">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    type="text"
                    id="searchFavorite"
                    placeholder="ค้นหาอนิเมะใน Favorite..."
                    autocomplete="off">

            </div>


            <div class="count-box">

                <div class="count-icon">

                    <i class="fa-solid fa-heart"></i>

                </div>

                <div>

                    <span class="count-label">
                        รายการโปรด
                    </span>

                    <strong id="favoriteCount">
                        0
                    </strong>

                    <span class="count-unit">
                        เรื่อง
                    </span>

                </div>

            </div>

        </section>


        <!-- ==================================================
             SECTION TITLE
        ================================================== -->

        <section class="content-heading">

            <div>

                <h2>
                    <i class="fa-solid fa-heart"></i>
                    รายการโปรดของฉัน
                </h2>

                <p>
                    อนิเมะที่คุณชื่นชอบ
                </p>

            </div>

        </section>


        <!-- ==================================================
             ANIME LIST
        ================================================== -->

        <section
            id="favoriteList"
            class="anime-grid">

            <div class="loading">

                <div class="loader"></div>

                <p>
                    กำลังโหลดรายการโปรด...
                </p>

            </div>

        </section>


        <!-- ==================================================
             EMPTY
        ================================================== -->

        <section
            id="emptyBox"
            class="empty-box"
            style="display:none;">

            <div class="empty-icon">

                <i class="fa-solid fa-heart-crack"></i>

            </div>

            <h2>
                ยังไม่มีอนิเมะที่ถูกใจ
            </h2>

            <p>
                เพิ่มอนิเมะที่คุณชื่นชอบจากหน้ารายละเอียด
                แล้วจะปรากฏที่นี่
            </p>

            <a
                href="../index.html"
                class="home-btn">

                <i class="fa-solid fa-compass"></i>

                เลือกอนิเมะ

            </a>

        </section>

    </main>


    <script
        type="module"
        src="../js/theme.js">
    </script>

    <script
        type="module"
        src="../js/favorite.js">
    </script>

</body>

</html>
