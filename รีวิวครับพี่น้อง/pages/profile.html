<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Anime Review Hub</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>

<body>

<div class="profile-page">

    <!-- Top Navigation -->
    <div class="profile-nav">
        <button class="back-btn" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="nav-title">
            <span>My Profile</span>
            <small>Anime Review Hub</small>
        </div>

        <button id="darkBtn" class="theme-btn">
            🌙
        </button>
    </div>


    <!-- Profile Hero -->
    <section class="profile-hero">

        <div class="hero-bg"></div>

        <div class="profile-content">

            <div class="avatar-wrapper">
                <img
                    id="profileImage"
                    src="../logo-icon.png"
                    alt="Profile"
                >

                <span class="online-dot"></span>
            </div>

            <h1 id="displayName">กำลังโหลด...</h1>

            <p class="profile-email">
                <i class="fa-solid fa-envelope"></i>
                <span id="displayEmail">กำลังโหลด...</span>
            </p>

            <div class="role-badge">
                <i class="fa-solid fa-crown"></i>
                <span id="displayRole">User</span>
            </div>

        </div>
    </section>


    <!-- Statistics -->
    <section class="stats-grid">

        <div class="stat-card favorite-stat">
            <div class="stat-icon">
                <i class="fa-solid fa-heart"></i>
            </div>

            <div class="stat-info">
                <strong id="favoriteCount">0</strong>
                <span>Favorite</span>
            </div>
        </div>


        <div class="stat-card bookmark-stat">
            <div class="stat-icon">
                <i class="fa-solid fa-bookmark"></i>
            </div>

            <div class="stat-info">
                <strong id="bookmarkCount">0</strong>
                <span>Bookmark</span>
            </div>
        </div>


        <div class="stat-card review-stat">
            <div class="stat-icon">
                <i class="fa-solid fa-comments"></i>
            </div>

            <div class="stat-info">
                <strong id="reviewCount">0</strong>
                <span>Reviews</span>
            </div>
        </div>

    </section>


    <!-- Edit Profile -->
    <section class="profile-card edit-card">

        <div class="section-title">
            <div class="title-icon">
                <i class="fa-solid fa-user-pen"></i>
            </div>

            <div>
                <h2>แก้ไขโปรไฟล์</h2>
                <p>จัดการข้อมูลส่วนตัวของคุณ</p>
            </div>
        </div>


        <div class="form-group">
            <label for="name">
                <i class="fa-solid fa-user"></i>
                ชื่อผู้ใช้
            </label>

            <input
                type="text"
                id="name"
                placeholder="กรอกชื่อผู้ใช้"
                autocomplete="off"
            >
        </div>


        <div class="form-group">
            <label for="photo">
                <i class="fa-solid fa-image"></i>
                URL รูปโปรไฟล์
            </label>

            <input
                type="text"
                id="photo"
                placeholder="https://example.com/profile.jpg"
                autocomplete="off"
            >

            <small class="input-help">
                ใส่ URL รูปภาพเพื่อใช้เป็นรูปโปรไฟล์
            </small>
        </div>


        <button id="saveProfile" class="save-btn">
            <i class="fa-solid fa-floppy-disk"></i>
            บันทึกข้อมูล
        </button>

    </section>


    <!-- Quick Menu -->
    <section class="profile-card quick-card">

        <div class="section-title compact">
            <div class="title-icon">
                <i class="fa-solid fa-layer-group"></i>
            </div>

            <div>
                <h2>เมนูของฉัน</h2>
                <p>เข้าถึงรายการที่บันทึกไว้</p>
            </div>
        </div>


        <a href="favorite.html" class="quick-item">

            <div class="quick-icon favorite-icon">
                <i class="fa-solid fa-heart"></i>
            </div>

            <div class="quick-text">
                <strong>Favorite</strong>
                <span>รายการ Anime ที่คุณชื่นชอบ</span>
            </div>

            <i class="fa-solid fa-chevron-right arrow"></i>

        </a>


        <a href="bookmark.html" class="quick-item">

            <div class="quick-icon bookmark-icon">
                <i class="fa-solid fa-bookmark"></i>
            </div>

            <div class="quick-text">
                <strong>Bookmark</strong>
                <span>Anime ที่บันทึกไว้อ่านภายหลัง</span>
            </div>

            <i class="fa-solid fa-chevron-right arrow"></i>

        </a>

    </section>


    <!-- Logout -->
    <button id="logoutBtn" class="logout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
        Logout
    </button>

</div>


<script type="module" src="../js/theme.js"></script>
<script type="module" src="../js/profile.js"></script>

</body>
</html>
