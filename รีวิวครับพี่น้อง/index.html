<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Anime Review Hub</title>


    <!-- =========================
         CSS
    ========================== -->

   <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">


    <!-- =========================
         Google Font
    ========================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- =========================
         Font Awesome
    ========================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


<!-- =====================================================
     USER BAR
===================================================== -->

<div class="top-user">


    <!-- =========================
         User Left
    ========================== -->

    <div class="user-left">


        <!-- Profile Image -->

        <img
            id="userAvatar"
            class="user-avatar"
            src="https://api.dicebear.com/9.x/initials/svg?seed=User"
            alt="Profile">


        <!-- User Name -->

        <div class="user-info">

            <span id="username">
                Loading...
            </span>

        </div>


    </div>


    <!-- =========================
         User Actions
    ========================== -->

    <div class="user-actions">


        <!-- Dark Mode -->

        <button
            id="darkBtn"
            class="top-action-btn"
            type="button"
            title="เปลี่ยนธีม">

            🌙

        </button>


        <!-- Logout -->

        <button
            id="logoutBtn"
            type="button">

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>


    </div>


</div>



<!-- =====================================================
     HEADER
===================================================== -->

<header>


    <div class="hero">


        <!-- =================================================
             LOGO + SEARCH
        ================================================= -->

        <div class="hero-top">


            <!-- =========================
                 Logo
            ========================== -->

          <div class="logo">

    <div class="logo-icon">

       <img
    src="logo-icon.png"
    alt="Anime Review Hub">

    </div>

    <div class="logo-text">

        <h1>Anime Review Hub</h1>

        <p>
            Discover • Review • Favorite
        </p>

    </div>

</div>



            <!-- =========================
                 Search
            ========================== -->

            <div class="hero-search">


                <i
                    class="fa-solid fa-magnifying-glass">
                </i>


                <input
                    type="text"
                    id="searchAnime"
                    placeholder="ค้นหาอนิเมะ..."
                    autocomplete="off">


            </div>


        </div>



        <!-- =================================================
             MAIN MENU
        ================================================= -->

        <div class="menu-btn">


            <!-- Favorite -->

            <a
                href="pages/favorite.html"
                class="nav-btn">

                <span>❤️</span>

                <span>Favorite</span>

            </a>


            <!-- Bookmark -->

            <a
                href="pages/bookmark.html"
                class="nav-btn">

                <span>🔖</span>

                <span>Bookmark</span>

            </a>


            <!-- Profile -->

            <a
                href="pages/profile.html"
                class="nav-btn">

                <span>👤</span>

                <span>Profile</span>

            </a>


            <!-- Admin -->

            <a
                href="pages/admin.html"
                id="adminMenu"
                class="nav-btn"
                style="display:none;">

                <span>⚙️</span>

                <span>Admin</span>

            </a>


        </div>



        <!-- =================================================
             SUPER ADMIN MENU
        ================================================= -->

        <div
            id="superAdminMenu"
            class="super-admin-menu"
            style="display:none;">


            <a
                href="pages/users.html"
                class="nav-btn">

                <span>👥</span>

                <span>Users Management</span>

            </a>


        </div>


    </div>

</header>



<!-- =====================================================
     CATEGORY
===================================================== -->

<section class="category">


    <button
        type="button"
        class="active"
        onclick="filterAnime(event, 'All')">

        🔥 ทั้งหมด

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Action')">

        🟣 Action

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Adventure')">

        🟢 Adventure

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Fantasy')">

        🟠 Fantasy

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Comedy')">

        🟡 Comedy

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Romance')">

        ❤️ Romance

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Sport')">

        ⚽ Sport

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Drama')">

        🎭 Drama

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Sci-Fi')">

        🚀 Sci-Fi

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Mystery')">

        🕵️ Mystery

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Horror')">

        👻 Horror

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'School')">

        🏫 School

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Slice of Life')">

        🌸 Slice of Life

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Supernatural')">

        ✨ Supernatural

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Isekai')">

        🌍 Isekai

    </button>


    <button
        type="button"
        onclick="filterAnime(event, 'Music')">

        🎵 Music

    </button>


</section>



<!-- =====================================================
     TITLE
===================================================== -->

<section class="title">

    <div>

        <h2>
            🔥 Trending Anime
        </h2>


        <p>
            ค้นหาอนิเมะที่คุณชื่นชอบและแบ่งปันรีวิวกับทุกคน
        </p>

    </div>

</section>



<!-- =====================================================
     ANIME LIST
===================================================== -->

<section
    class="anime-container"
    id="animeList">


    <!-- Loading -->

    <div class="loading">

        <div class="loader"></div>

    </div>


</section>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script type="module" src="js/theme.js"></script>
<script type="module" src="js/script.js"></script>
<script type="module" src="js/user.js"></script>


</body>

</html>
